[package]
name = "varita"
version = "1.0.0"
edition = "2024"
description = "BW2Color Movie: black-and-white film colorization, repair and exemplar rendering (DDColor / DeOldify)"

[[bin]]
name = "BW2Color"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON-skeeman kenttäjärjestys ratkaisee, missä järjestyksessä näkömalli vastaa
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
eframe = "0.37"
rfd = "0.17"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
crc32fast = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
itsetesti = []

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

[profile.dev]
opt-level = 2
